<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Our Sponsors — ZIMS</title>
<link rel="icon" href="assets/zims-icon-transparent.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="site-header" class="site-header"></div>

<main style="background:linear-gradient(180deg, #000000 0%, var(--navy-800) 50.481%, var(--navy-700) 100%);">
  <section class="title-banner">
    <img src="assets/OurSponsorsBanner.webp" alt="Our Sponsors" />
  </section>

  <p class="sponsor-blurb">
    We are proud to work with organizations that support our mission of making hands-on engineering accessible to
    students of all experience levels at a world-class engineering institution.
  </p>

  <div class="sponsor-grid">
    <div class="sponsor-row">
      <div class="sponsor-logo bg-black"><img src="assets/sponsor-genehaas.webp" alt="Gene Haas Foundation" /></div>
      <div class="sponsor-logo bg-white"><img src="assets/sponsor-labcorp.webp" alt="LabCorp Charitable Foundation" /></div>
    </div>
    <div class="sponsor-row">
      <div class="sponsor-logo bg-black"><img src="assets/sponsor-autodesk.webp" alt="Autodesk Foundation" /></div>
      <div class="sponsor-logo bg-white"><img src="assets/sponsor-sendcutsend.webp" alt="SendCutSend" /></div>
    </div>
    <div class="sponsor-row">
      <div class="sponsor-logo bg-blue"><img src="assets/sponsor-uci.webp" alt="UCI Samueli School of Engineering — Office for Experiential Learning" /></div>
      <div class="sponsor-logo bg-white"><img src="assets/sponsor-costco.webp" alt="Costco Wholesale" /></div>
    </div>
  </div>
</main>

<div id="site-footer" class="site-footer"></div>

<script src="js/header-footer.js"></script>
<script src="js/main.js"></script>
</body>
</html>
